name: Fuzz
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - name: Run fuzzer
        run: cargo +nightly fuzz run parse -- -max_total_time=300 2>&1 | tee fuzz-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-output
          path: |
            fuzz-run.log
            fuzz/artifacts/
          if-no-files-found: warn