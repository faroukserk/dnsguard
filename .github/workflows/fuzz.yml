name: Fuzz
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - name: Run fuzzer
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly fuzz run parse -- -max_total_time=300 2>&1 | tee fuzz-run.log
      - name: Report results
        if: always()
        shell: bash
        run: |
          {
            echo "## Fuzz results"
            echo ""
            echo "Last lines of fuzz log:"
            echo '```'
            tail -n 15 fuzz-run.log 2>/dev/null || echo "no log file"
            echo '```'
            echo ""
            if ls fuzz/artifacts/parse/* >/dev/null 2>&1; then
              echo "**Crash files found:**"
              ls fuzz/artifacts/parse/
            else
              echo "No crash files."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "--- log tail ---"
          tail -n 15 fuzz-run.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-output
          path: |
            fuzz-run.log
            fuzz/artifacts/
          if-no-files-found: ignore