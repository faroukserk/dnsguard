[workspace]
members = ["."]
exclude = ["fuzz"]

[package]
name = "dnsguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
moka = { version = "0.12.16", features = ["future"] }
hickory-proto = "0.26.3"

[dev-dependencies]
tempfile = "3"
